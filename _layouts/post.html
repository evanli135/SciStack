---
layout: default
---
<article>
  <div class="post-header">
    <div class="post-meta">
      <span>{{ page.date | date: "%b %d, %Y" }}</span>
      {% if page.tag %}<span class="post-meta-tag">{{ page.tag }}</span>{% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </div>

  <div class="post-body">
    {{ content }}
  </div>
</article>
